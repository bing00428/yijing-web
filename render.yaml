# Render 部署配置
# 参考: https://render.com/docs/deploy-flask

build:
  commands:
    - pip install -r requirements.txt

run:
  command: gunicorn wsgi:app
  envVars:
    - key: PYTHON_VERSION
      value: 3.11.0
    - key: SUPABASE_PROJECT_REF
      value: qkxzmmqhewhpflgyuoud
    - key: SUPABASE_DB_PASSWORD
      sync: false
    - key: SUPABASE_DB_HOST
      value: db.qkxzmmqhewhpflgyuoud.supabase.co
    - key: SUPABASE_DB_PORT
      value: "5432"
